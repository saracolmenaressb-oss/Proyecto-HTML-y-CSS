<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo</title>
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
<main>
    <section class="Catalogo">
        <article class="card">
            <img src="img/camisa balnca, sencilla.png" alt="camisa blanca sencilla">
            <h3>Camisa juvenil, color blanco, con golas</h3>
            <p>$60.000</p>
        </article>
        <article class="card">
            <img src="img/saco morado.png" alt="saco">
            <h3>Saco de mujer, color morado</h3>
            <p>$130.000</p>
        </article>
        <article class="card">
            <img src="img/saco amarillo.png" alt="saco">
            <h3>Saco de mujer, color amarillo limon</h3>
            <p>$120.000</p>
        </article>
        <article class="card">
            <img src="img/camisa estanpada oso.png" alt="camiseta con estampado">
            <h3>Camiseta juevenil, con estampado de osito</h3>
            <p>$50.000</p>
        </article>
        <article class="card">
            <img src="img/camisa de flores.png" alt="camiseta con estampado de flores">
            <h3>Camiseta de mujer, con estampado de flores</h3>
            <p>$30.000</p>
        </article>
    </section> 
</main>
</body>
</html>
