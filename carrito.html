<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS SHOP</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="encabezado">
        <a href="perfil.html"><img src="img/perfil.png" alt=""></a>
        <h1>Campus shop</h1>
        <a href="carrito.html"><img src="img/carrito de compras.png" alt=""></a>
    </header>
    <main class="carro">
        <article class="carrito">
            <img src="img/tenis.jpg">
            <h2>tennis campus</h2>
            <p>tennis campus, color rojo con detalles rosa</p>
            <p>$120.000</p>
            <input type="number" name="cantidad" class="cantidad">
        </article>
        <article class="carrito">
            <img src="img/abrigos.jpg">
            <h2>buso de mujer</h2>
            <p>buso de mujer, color negro, inspirado en un verano sin ti</p>
            <p class="precio">$240.000</p>
            <input type="number" name="cantidad" class="cantidad">
        </article>
        <article class="carrito">
            <img src="img/camiseta.webp">
            <h2>camisa de mujer, blanca</h2>
            <p>Camisa basica de mujer, color blanco</p>
            <p>$60.000</p>
            <input type="number" name="cantidad" class="cantidad">
        </article>

    </main>
    <footer class="pieDePagina">
        <div>    
            <a href="index.html"><img src="img/casa.png" class="icono">
            <p>inicio</p>
            </a>
        </div> 
        <div>
            <a href="catalogo.html">
            <img src="img/categoria.png" class="icono">
            <p>categorias</p>
            </a>
        </div>
        <div>
            <a href="carrito.html"><img src="img/carrito de compras.png" class="icono">
                <p>carrito</p>
            </a>
            
        </div>
        <div>
            <img src="img/corazo.png" class="icono">
            <p>favoritos</p>
        </div>
        <div>
            <img src="img/perfil.png" class="icono">
            <p>perfil</p>
        </div>        
    </footer>
</body>
