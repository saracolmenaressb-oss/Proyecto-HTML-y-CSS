<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMPUS SHOP</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="encabezado">
        <a href="index.html"><img src="img/flecha.png" alt=""></a>
        <h1>Checkout</h1>
    </header>
<main>
   <form class="checkout">
        <h2>Envio</h2>

        <p>Nombre</p>
        <input type="text" placeholder="Ingresa tu nombre completo">

        <p>Dirección</p>
        <input type="text" placeholder="Ingresa tu dirección">

        <p>Ciudad</p>
        <input type="text" placeholder="Tu ciudad">
    </form>
    <h2>Método de pago</h2>

    <div class="metodos-container">
        <div class="metodo">
            <img src="img/visa.png" alt="">
            <p>Visa</p>
        </div>

        <div class="metodo">
            <img src="img/mastercard.png" alt="">
            <p>Mastercard</p>
        </div>

        <div class="metodo">
            <img src="img/paypal.png" alt="">
            <p>Paypal</p>
        </div>
    </div>
</main>
<section class="resumen">
    <div class="pagar">
        <h2>Resumen de tu Orden</h2>

        <div class="parte-pagar">
            <img src="img/buso.avif" alt="">
            <div class="info-check">
                <p class="nombre">Buso rosado</p>
                <p class="cantidad-check">Cantidad: 1</p>
            </div>
            <span class="precio">$240.000</span>
        </div>

        <div class="parte-pagar">
            <img src="img/tenis.jpg" alt="">
            <div class="info-check">
                <p class="nombre">Campus rojos</p>
                <p class="cantidad-check">Cantidad: 1</p>
            </div>
            <span class="precio">$120.000</span>
        </div>

        <div class="total">
            <p>Total</p>
            <span>$360.000</span>
        </div>
    </div>

    <button class="btn-pagar">Pagar $224.500</button>
</section>
</form>
    <footer class="pieDePagina">
    <div>    
        <a href="index.html"><img src="img/casa.png" class="icono">
        <p>inicio</p>
        </a>
    </div> 
    <div>
        <a href="catalogo.html">
        <img src="img/categoria.png" class="icono">
        <p>categorias</p>
        </a>
    </div>
    <div>
        <a href="carrito.html"><img src="img/carrito de compras.png" class="icono">
            <p>carrito</p>
        </a>
        
    </div>
    <div>
        <img src="img/corazo.png" class="icono">
        <p>favoritos</p>
    </div>
    <div>
        <a href="perfil.html">
            <img src="img/perfil.png" class="icono">
            <p>perfil</p>
        </a>
    </div>        
</footer>
</body>
</html>
